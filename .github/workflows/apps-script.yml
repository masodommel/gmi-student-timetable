name: Deploy apps script
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check clasp configuration
        run: |
          if grep -q 'REPLACE_WITH_SCRIPT_ID' apps-script/.clasp.json; then
            echo '::error::Set scriptId in apps-script/.clasp.json before deploying.'
            exit 1
          fi
      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo '::error::Set the CLASPRC_JSON repository secret before deploying.'
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push project
        working-directory: apps-script
        run: npx --yes @google/clasp@3 push --force
