name: Build and publish timetable
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps-script/**'
  repository_dispatch:
    types: [timetable-source]
  workflow_dispatch:
    inputs:
      force:
        description: Publish an older source revision
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'publish timetable revision')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name != 'push'
        with:
          repository: masodommel/gmi-student-timetable-sources
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: .sources
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: source
        name: Pre-bake latest source
        if: github.event_name != 'push'
        run: npx tsx scripts/publish_latest_source.ts --sources .sources/sources ${{ inputs.force && '--force' || '' }}
      - name: Summarize source selection
        if: github.event_name != 'push'
        run: |
          {
            echo '### Source selection'
            echo "- Changed: ${{ steps.source.outputs.changed || 'false' }}"
            echo "- Revision: ${{ steps.source.outputs.revision || 'n/a' }}"
            echo "- Filename: ${{ steps.source.outputs.filename || 'n/a' }}"
            echo "- Skipped invalid: ${{ steps.source.outputs.invalid || '0' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure raw sources stay private
        run: |
          if git ls-files '*.dav' | grep -q .; then
            echo '::error::Raw DAV tracked in the public repository'
            exit 1
          fi
          if find public -type f -name '*.dav' | grep -q .; then
            echo '::error::Raw DAV found in public/'
            exit 1
          fi
      - run: npm test
        if: github.event_name != 'repository_dispatch' || steps.source.outputs.changed == 'true'
      - name: Commit regenerated datasets
        if: steps.source.outputs.changed == 'true'
        env:
          COMMIT_TOKEN: ${{ secrets.COMMIT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          git commit -m "publish timetable revision ${{ steps.source.outputs.revision }}"
          git fetch origin main
          git rebase origin/main
          if [ -n "$COMMIT_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${COMMIT_TOKEN}@github.com/${REPOSITORY}.git"
          fi
          git push origin HEAD:main
      - run: npm run build
        if: github.event_name != 'repository_dispatch' || steps.source.outputs.changed == 'true'
      - name: Verify Pages output
        if: github.event_name != 'repository_dispatch' || steps.source.outputs.changed == 'true'
        run: |
          if find dist -type f -name '*.dav' | grep -q .; then
            echo '::error::Raw DAV found in dist/'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'repository_dispatch' || steps.source.outputs.changed == 'true'
        with:
          name: timetable-dist
          path: dist
  github-pages:
    needs: build
    if: github.event_name != 'repository_dispatch' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare redirect
        if: vars.GITHUB_PAGES_MODE != 'dev'
        run: |
          mkdir -p gh-pages-build
          cp -R github-pages/. gh-pages-build/
      - uses: actions/download-artifact@v4
        if: vars.GITHUB_PAGES_MODE == 'dev'
        with:
          name: timetable-dist
          path: gh-pages-build
      - name: Disable indexing in dev mode
        if: vars.GITHUB_PAGES_MODE == 'dev'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > gh-pages-build/robots.txt
          node -e "const fs=require('fs');const p='gh-pages-build/index.html';const h=fs.readFileSync(p,'utf8');fs.writeFileSync(p,h.replace('<head>','<head><meta name=\"robots\" content=\"noindex\">'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-build
      - id: deployment
        uses: actions/deploy-pages@v4
